<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizzBuzz ゲーム & 一覧</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      
      --fizz-color: #38bdf8;
      --buzz-color: #fbbf24;
      --fizzbuzz-color: #c084fc;
      --number-color: #94a3b8;
      --accent-color: #38bdf8;
      --success-color: #4ade80;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    /* タブ切り替え */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* ゲームエリア */
    .game-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #0f172a;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-val {
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    /* 数字ディスプレイ */
    .target-display {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
    }

    .target-number {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      transition: transform 0.1s ease;
    }

    .target-number.pop {
      animation: numPop 0.15s ease-out;
    }

    @keyframes numPop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .feedback-text {
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 2rem;
      margin-top: 0.5rem;
      transition: all 0.2s;
    }

    .feedback-text.correct { color: var(--success-color); }
    .feedback-text.wrong { color: var(--error-color); }

    /* キーボードボタン群 */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto 1.5rem auto;
    }

    @media (min-width: 640px) {
      .buttons-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .action-btn {
      background: #0f172a;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 1.2rem 0.8rem;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.1s ease;
      position: relative;
    }

    .action-btn:hover {
      border-color: #64748b;
      transform: translateY(-2px);
    }

    .action-btn:active, .action-btn.pressed {
      transform: translateY(2px) scale(0.98);
      filter: brightness(1.2);
    }

    .btn-fizz {
      border-color: rgba(56, 189, 248, 0.4);
    }
    .btn-fizz:hover, .btn-fizz.pressed {
      border-color: var(--fizz-color);
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .btn-buzz {
      border-color: rgba(251, 191, 36, 0.4);
    }
    .btn-buzz:hover, .btn-buzz.pressed {
      border-color: var(--buzz-color);
      background: rgba(251, 191, 36, 0.15);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
    }

    .btn-fizzbuzz {
      border-color: rgba(192, 132, 252, 0.4);
    }
    .btn-fizzbuzz:hover, .btn-fizzbuzz.pressed {
      border-color: var(--fizzbuzz-color);
      background: rgba(192, 132, 252, 0.15);
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.3);
    }

    .btn-number {
      border-color: rgba(148, 163, 184, 0.4);
    }
    .btn-number:hover, .btn-number.pressed {
      border-color: #cbd5e1;
      background: rgba(148, 163, 184, 0.15);
    }

    .btn-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .key-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    /* ゲームオーバー / スタートオーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 0.8rem;
    }

    .overlay p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn-start {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      color: #0f172a;
      border: none;
      border-radius: 9999px;
      padding: 0.9rem 2.4rem;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
    }

    .result-score {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      background: #1e293b;
      padding: 1rem 2rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      line-height: 1.8;
    }

    /* 一覧モード */
    .list-panel {
      display: none;
    }

    .list-panel.active {
      display: block;
    }

    .list-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-fizz { background-color: var(--fizz-color); }
    .dot-buzz { background-color: var(--buzz-color); }
    .dot-fizzbuzz { background-color: var(--fizzbuzz-color); }
    .dot-number { background-color: var(--number-color); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.8rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 0.8rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .card.is-fizz { border-color: var(--fizz-color); color: var(--fizz-color); }
    .card.is-buzz { border-color: var(--buzz-color); color: var(--buzz-color); }
    .card.is-fizzbuzz { border-color: var(--fizzbuzz-color); color: var(--fizzbuzz-color); font-weight: 700; }
    .card.is-number { color: var(--text-color); }

    .card-num { font-size: 0.75rem; color: var(--text-muted); }
    .card-label { font-size: 1.1rem; font-weight: 700; }

    /* シェイク演出 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- タブ切り替え -->
    <div class="tabs">
      <button id="tab-game" class="tab-btn active">🎮 キーボードゲーム</button>
      <button id="tab-list" class="tab-btn">📋 1〜50 一覧</button>
    </div>

    <!-- ゲームモード画面 -->
    <div id="game-panel" class="game-panel">
      <!-- スタートオーバーレイ -->
      <div id="start-overlay" class="overlay">
        <h2>⚡ FizzBuzz RUSH</h2>
        <p>
          1から50までの数字が次々と出題されます！<br>
          キーボードの <b>[1] [2] [3] [4]</b> または対応キーを素早く叩いて、最速タイムを目指そう！
        </p>
        <button id="btn-start" class="btn-start">ゲームスタート (Space)</button>
      </div>

      <!-- リザルトオーバーレイ -->
      <div id="result-overlay" class="overlay hidden">
        <h2>🎉 クリア！</h2>
        <div id="result-score" class="result-score"></div>
        <button id="btn-restart" class="btn-start">もう一度挑戦 (Space)</button>
      </div>

      <!-- ヘッダー情報 -->
      <div class="game-header">
        <div class="stat-badge">進捗: <span id="progress-val" class="stat-val">1 / 50</span></div>
        <div class="stat-badge">コンボ: <span id="combo-val" class="stat-val">0</span></div>
        <div class="stat-badge">タイム: <span id="timer-val" class="stat-val">0.00s</span></div>
      </div>

      <!-- 数字表示 -->
      <div class="target-display">
        <div id="target-number" class="target-number">1</div>
        <div id="feedback-text" class="feedback-text"></div>
      </div>

      <!-- 4択キーボードボタン -->
      <div class="buttons-grid">
        <button id="btn-choice-num" class="action-btn btn-number" data-choice="num">
          <span class="btn-title">そのまま (数値)</span>
          <span class="key-badge">キー [ 1 ] または [ Space ]</span>
        </button>

        <button id="btn-choice-fizz" class="action-btn btn-fizz" data-choice="fizz">
          <span class="btn-title" style="color: var(--fizz-color);">Fizz</span>
          <span class="key-badge">キー [ 2 ] または [ F ]</span>
        </button>

        <button id="btn-choice-buzz" class="action-btn btn-buzz" data-choice="buzz">
          <span class="btn-title" style="color: var(--buzz-color);">Buzz</span>
          <span class="key-badge">キー [ 3 ] または [ B ]</span>
        </button>

        <button id="btn-choice-fizzbuzz" class="action-btn btn-fizzbuzz" data-choice="fizzbuzz">
          <span class="btn-title" style="color: var(--fizzbuzz-color);">FizzBuzz</span>
          <span class="key-badge">キー [ 4 ] または [ Z ]</span>
        </button>
      </div>
    </div>

    <!-- 一覧表示画面 -->
    <div id="list-panel" class="list-panel">
      <div class="list-header">
        <h2>FizzBuzz (1〜50 一覧)</h2>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="dot dot-fizz"></span>Fizz (3の倍数)</span>
        <span class="legend-item"><span class="dot dot-buzz"></span>Buzz (5の倍数)</span>
        <span class="legend-item"><span class="dot dot-fizzbuzz"></span>FizzBuzz (15の倍数)</span>
        <span class="legend-item"><span class="dot dot-number"></span>数値 (その他)</span>
      </div>
      <div id="fizzbuzz-grid" class="grid"></div>
    </div>
  </div>

  <script>
    // Web Audio API によるシンセ効果音
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundCorrect(combo = 1) {
      const baseFreq = 440;
      const note = baseFreq * Math.pow(1.05, Math.min(combo, 15));
      playTone(note, 'triangle', 0.12, 0.15);
    }

    function soundWrong() {
      playTone(180, 'sawtooth', 0.25, 0.18);
    }

    function soundClear() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'sine', 0.3, 0.15), idx * 120);
      });
    }

    // ゲームロジック
    function getExpectedChoice(n) {
      if (n % 15 === 0) return "fizzbuzz";
      if (n % 3 === 0) return "fizz";
      if (n % 5 === 0) return "buzz";
      return "num";
    }

    let isPlaying = false;
    let currentNum = 1;
    let combo = 0;
    let maxCombo = 0;
    let errors = 0;
    let startTime = 0;
    let timerInterval = null;

    const targetNumberEl = document.getElementById("target-number");
    const feedbackTextEl = document.getElementById("feedback-text");
    const progressValEl = document.getElementById("progress-val");
    const comboValEl = document.getElementById("combo-val");
    const timerValEl = document.getElementById("timer-val");
    const gamePanelEl = document.getElementById("game-panel");
    const startOverlayEl = document.getElementById("start-overlay");
    const resultOverlayEl = document.getElementById("result-overlay");
    const resultScoreEl = document.getElementById("result-score");

    const btnStart = document.getElementById("btn-start");
    const btnRestart = document.getElementById("btn-restart");

    function startGame() {
      isPlaying = true;
      currentNum = 1;
      combo = 0;
      maxCombo = 0;
      errors = 0;
      startTime = Date.now();

      startOverlayEl.classList.add("hidden");
      resultOverlayEl.classList.add("hidden");

      updateDisplay();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        timerValEl.textContent = elapsed.toFixed(2) + "s";
      }, 30);
    }

    function updateDisplay() {
      targetNumberEl.textContent = currentNum;
      targetNumberEl.classList.remove("pop");
      void targetNumberEl.offsetWidth; // リフロー発生
      targetNumberEl.classList.add("pop");

      progressValEl.textContent = `${currentNum} / 50`;
      comboValEl.textContent = combo;
    }

    function handleInput(choice) {
      if (!isPlaying) return;

      const expected = getExpectedChoice(currentNum);
      const isCorrect = choice === expected;

      // ボタンの押し込み演出
      const btn = document.querySelector(`[data-choice="${choice}"]`);
      if (btn) {
        btn.classList.add("pressed");
        setTimeout(() => btn.classList.remove("pressed"), 120);
      }

      if (isCorrect) {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        soundCorrect(combo);
        feedbackTextEl.className = "feedback-text correct";
        feedbackTextEl.textContent = combo > 1 ? `GREAT! (${combo} COMBO)` : "OK!";

        if (currentNum >= 50) {
          finishGame();
          return;
        }

        currentNum++;
        updateDisplay();
      } else {
        combo = 0;
        errors++;
        soundWrong();
        feedbackTextEl.className = "feedback-text wrong";
        
        let correctLabel = "そのまま";
        if (expected === "fizz") correctLabel = "Fizz";
        if (expected === "buzz") correctLabel = "Buzz";
        if (expected === "fizzbuzz") correctLabel = "FizzBuzz";
        
        feedbackTextEl.textContent = `MISS! 正解は [ ${correctLabel} ]`;

        gamePanelEl.classList.remove("shake");
        void gamePanelEl.offsetWidth;
        gamePanelEl.classList.add("shake");
        comboValEl.textContent = combo;
      }
    }

    function finishGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      const totalTime = ((Date.now() - startTime) / 1000).toFixed(2);
      soundClear();

      let rank = "S";
      const totalTimeNum = parseFloat(totalTime);
      if (totalTimeNum > 40 || errors > 5) rank = "A";
      if (totalTimeNum > 60 || errors > 10) rank = "B";
      if (errors > 15) rank = "C";

      resultScoreEl.innerHTML = `
        ランク: <b style="font-size: 2rem; color: #f59e0b;">${rank}</b><br>
        タイム: <b>${totalTime} 秒</b><br>
        ミス回数: <b>${errors} 回</b><br>
        最大コンボ: <b>${maxCombo} 連続</b>
      `;

      resultOverlayEl.classList.remove("hidden");
    }

    // キーボード入力受付
    window.addEventListener("keydown", (e) => {
      // プレイ中でないときの Space / Enter でスタート
      if (!isPlaying) {
        if (e.code === "Space" || e.key === "Enter") {
          e.preventDefault();
          startGame();
        }
        return;
      }

      const key = e.key.toLowerCase();

      // [1] または Space で「そのまま」
      if (key === "1" || key === " " || key === "j") {
        e.preventDefault();
        handleInput("num");
      }
      // [2] または F で「Fizz」
      else if (key === "2" || key === "f") {
        e.preventDefault();
        handleInput("fizz");
      }
      // [3] または B で「Buzz」
      else if (key === "3" || key === "b") {
        e.preventDefault();
        handleInput("buzz");
      }
      // [4] または Z で「FizzBuzz」
      else if (key === "4" || key === "z") {
        e.preventDefault();
        handleInput("fizzbuzz");
      }
    });

    // クリックイベント
    document.querySelectorAll(".action-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        handleInput(btn.dataset.choice);
      });
    });

    btnStart.addEventListener("click", startGame);
    btnRestart.addEventListener("click", startGame);

    // タブ切り替え
    const tabGame = document.getElementById("tab-game");
    const tabList = document.getElementById("tab-list");
    const listPanel = document.getElementById("list-panel");

    tabGame.addEventListener("click", () => {
      tabGame.classList.add("active");
      tabList.classList.remove("active");
      gamePanelEl.style.display = "block";
      listPanel.classList.remove("active");
    });

    tabList.addEventListener("click", () => {
      tabList.classList.add("active");
      tabGame.classList.remove("active");
      gamePanelEl.style.display = "none";
      listPanel.classList.add("active");
      renderList();
    });

    // 一覧描画
    function renderList() {
      const container = document.getElementById("fizzbuzz-grid");
      if (container.children.length > 0) return;

      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= 50; i++) {
        let label = String(i);
        let cls = "is-number";
        if (i % 15 === 0) { label = "FizzBuzz"; cls = "is-fizzbuzz"; }
        else if (i % 3 === 0) { label = "Fizz"; cls = "is-fizz"; }
        else if (i % 5 === 0) { label = "Buzz"; cls = "is-buzz"; }

        const card = document.createElement("div");
        card.className = `card ${cls}`;
        card.innerHTML = `
          <span class="card-num">#${i}</span>
          <span class="card-label">${label}</span>
        `;
        fragment.appendChild(card);
      }
      container.appendChild(fragment);
    }
  </script>
</body>
</html>
